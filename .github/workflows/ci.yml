name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select the installed Playwright browser
        run: node --input-type=module -e "import { chromium } from 'playwright'; console.log('STUDY_SHEET_CHROME=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .test-output/
          retention-days: 7
